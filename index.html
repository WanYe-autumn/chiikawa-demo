r:#94806c;border:1px solid #dbccbc;border-radius:10px}.clear-completed:hover:not(:disabled){background:#f0e8dc}.danger{color:#bb8089;background:#fff0f2}.task{border-bottom:1px dashed #e5d9cb}.task input{border-color:#c7b3a0;border-width:2px;background:#fffdf8;border-radius:7px}.task input:checked{background:#9ab9a1;border-color:#86a28a}.task.done label span{color:#b6ab9b}.edit{background:#eaf3f9;color:#7893a9;border-radius:9px}.delete{color:#b09c8f}.delete:hover{background:#ffe8ed;color:#b87887}.priority.high{background:#ffe6eb;color:#ad6474}.priority.medium{background:#fff1cd;color:#977b33}.priority.low{background:#e6f1e7;color:#628467}.empty-icon{background:#fff2d6;color:#a08a63;border:1px dashed #d9bf91;width:90px;height:53px;font-size:22px;border-radius:45%}.empty h3{color:#947664;font-weight:500}.empty p{color:#ac9784}.footer{border-top:2px dashed #eadfce;color:#a99682}.progress{background:#f1e9db}.progress div{background:#d7a9b4}body>footer{color:#b29d89}.notice{color:#a06e42}dialog{background:#fffaf0;border:2px solid #cdb7a6;color:#72594f;border-radius:22px}dialog::backdrop{background:#6e594c66}button:focus-visible,input:focus-visible,select:focus-visible{outline-color:#b4cfe2}@media(max-width:520px){.header{padding:22px 20px}.brand{font-size:18px}.local{font-size:10px}main{margin-top:13px}.eyebrow{font-size:9px;letter-spacing:1.7px}h1{font-size:28px}.subtitle{font-size:11px}.friends{width:290px;margin-top:17px}.stat{padding:13px 15px}.card{padding:18px}.stats{gap:10px}.footer{gap:10px}.progress{flex-shrink:0;width:65px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<header class="header"><div class="brand"><span class="logo">✿</span>小小待办</div><div class="local"><i class="dot"></i>和小可爱一起，慢慢来</div></header>
<main><div class="eyebrow">CHIIKAWA · LITTLE THINGS, BIG JOY</div><h1>我的待办清单<span class="title-flower" aria-hidden="true">✿</span></h1><p class="subtitle">今天也要和小可爱们一起，完成一点点小事呀。</p>
<svg class="friends" viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉伊、小八和乌萨奇一起陪你完成待办"><g stroke="#6d584d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M47 46l3-10m-8 5h13M425 87l3-10m-8 5h13" stroke="#dbb47d"/><path d="M222 22l3-8m-7 4h11" stroke="#dda3ad"/><ellipse cx="240" cy="177" rx="200" ry="9" fill="#ecddcc" stroke="none"/>
<g transform="translate(28 43)"><path d="M25 61L18 12Q17 0 31 9l26 19Q82 18 103 29l27-21q10-7 8 8l-5 45" fill="#b5dbef"/><path d="M27 47Q4 70 16 103q9 24 57 25 49 0 65-25 14-29-10-57-17 18-48 5-29-13-53-4" fill="#fffef8"/><path d="M48 123l-4 10m59-10 4 10"/><ellipse cx="48" cy="81" rx="4" ry="6" fill="#6d584d" stroke="none"/><ellipse cx="104" cy="81" rx="4" ry="6" fill="#6d584d" stroke="none"/><path d="M69 87q7 12 14 0m-7 8v7" fill="none"/><path d="M68 102q8 10 16 0" fill="#efb0bc"/><path d="M24 94h15m73 0h15" stroke="#efb3be" stroke-width="7"/></g>
<g transform="translate(172 45)"><circle cx="28" cy="24" r="17" fill="#fffef8"/><circle cx="105" cy="24" r="17" fill="#fffef8"/><path d="M17 40Q32 20 67 23q36-1 53 20 21 24 6 56-12 25-58 26-44-1-58-25-16-32 7-60" fill="#fffef8"/><path d="M39 122l-3 11m61-11 4 11"/><ellipse cx="40" cy="70" rx="4" ry="6" fill="#6d584d" stroke="none"/><ellipse cx="94" cy="70" rx="4" ry="6" fill="#6d584d" stroke="none"/><path d="M60 80q7 9 14 0m-7 6v5" fill="none"/><path d="M21 85h14m64 0h14" stroke="#f0b3bd" stroke-width="8"/><path d="M51 107q16-12 31 0" fill="none"/><path d="M55 107l12 12 12-12" fill="#f9d7df" stroke="#d79da8"/></g>
<g transform="translate(323 12)"><path d="M30 68Q18 12 31 6q17-5 22 58m27 0Q86 4 100 7q16 5 3 63" fill="#fff0bd"/><path d="M22 76q-17 19-9 49 9 31 56 32 43-1 54-28 12-30-8-52-34-30-93-1" fill="#fff0bd"/><path d="M42 155l-4 10m57-10 5 10"/><path d="M37 99l10 3-10 3m56-6-10 3 10 3" fill="none"/><path d="M60 111q8 10 15 0m-8 6v8" fill="none"/><path d="M59 126q9 13 18 0" fill="#eeb0b5"/><path d="M24 117h13m62 0h13" stroke="#edb2a9" stroke-width="7"/></g></g></svg><section class="stats" aria-label="任务统计" aria-live="polite"><div class="stat"><span>全部任务</span><strong id="total">0</strong></div><div class="stat active"><span>未完成</span><strong id="pending">0</strong></div><div class="stat"><span>已完成</span><strong id="completed">0</strong></div></section>
<section class="card" aria-label="待办清单"><form id="form" class="form"><label class="sr-only" for="new-task">任务内容</label><input type="text" id="new-task" placeholder="今天要做什么？" maxlength="500" autocomplete="off" required><label class="sr-only" for="new-priority">任务优先级</label><select id="new-priority" aria-label="任务优先级"><option value="high">高优先级</option><option value="medium" selected>中优先级</option><option value="low">低优先级</option></select><button class="add" type="submit"><span aria-hidden="true">➕</span> 添加任务</button></form><div id="notice" class="notice" role="status" hidden></div><div class="toolbar"><h2>我的待办</h2><div class="toolbar-actions"><button type="button" id="clear-all" class="clear-completed danger" disabled>全部清空</button><button type="button" id="clear-completed" class="clear-completed" disabled>清空已完成</button></div></div><ul id="tasks"></ul><div class="empty" id="empty"><div class="empty-icon" aria-hidden="true">ʕ •ᴥ• ʔ</div><h3>哇～今天的小期待是什么呢？</h3><p>先记下一件小事吧，小可爱们陪你慢慢完成。</p></div><div class="footer"><span id="progress-label">准备好，开始今天的第一步</span><div class="progress" aria-hidden="true"><div id="progress-bar"></div></div></div></section>
</main><footer>自动保存在当前浏览器 · 刷新后，待办依然在这里</footer><dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title">编辑任务</h2><div class="edit-fields"><label for="edit-text">任务内容</label><input id="edit-text" type="text" required maxlength="500" autocomplete="off"><label for="edit-priority">优先级</label><select id="edit-priority"><option value="high">高优先级</option><option value="medium">中优先级</option><option value="low">低优先级</option></select></div><div class="dialog-actions"><button type="button" id="edit-cancel" class="clear-completed">取消</button><button type="submit" class="add">保存修改</button></div></form></dialog><script>
'use strict';
const key='qingdan.tasks.v1';
const list=document.querySelector('#tasks'),input=document.querySelector('#new-task'),notice=document.querySelector('#notice');
let tasks=[];
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saved))throw new Error('Invalid data');tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean').map(t=>({...t,priority:['high','medium','low'].includes(t.priority)?t.priority:'medium'}))}catch{notice.hidden=false;notice.textContent='无法读取本地记录。你仍可添加任务；请检查浏览器是否允许本地存储。'}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));notice.hidden=true}catch{notice.hidden=false;notice.textContent='当前浏览器无法保存数据，刷新后可能丢失。请允许本地存储。'}}
function render(){list.replaceChildren();for(const task of tasks){const li=document.createElement('li');li.className='task'+(task.done?' done':'');const label=document.createElement('label'),check=document.createElement('input'),text=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=task.done;text.textContent=task.text;check.addEventListener('change',()=>{task.done=check.checked;li.classList.toggle('done',task.done);save();updateStats()});label.append(check,text);del.className='delete';del.type='button';del.setAttribute('aria-label','删除任务：'+task.text);del.title='删除任务';del.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';del.addEventListener('click',()=>{const index=tasks.indexOf(task);tasks.splice(index,1);save();render();const next=list.children[Math.min(index,tasks.length-1)];(next?.querySelector('.delete')||input).focus()});const badge=document.createElement('span');badge.className='priority '+task.priority;badge.textContent={high:'高优先级',medium:'中优先级',low:'低优先级'}[task.priority];const edit=document.createElement('button');edit.type='button';edit.className='edit';edit.textContent='编辑';edit.setAttribute('aria-label','编辑任务：'+task.text);edit.addEventListener('click',()=>openEditor(task,edit));const actions=document.createElement('div');actions.className='task-actions';actions.append(edit,del);li.append(label,badge,actions);list.append(li)}updateStats()}
function updateStats(){const completed=tasks.filter(t=>t.done).length;document.querySelector('#clear-completed').disabled=completed===0;document.querySelector('#clear-all').disabled=tasks.length===0;document.querySelector('#total').textContent=tasks.length;document.querySelector('#pending').textContent=tasks.length-completed;document.querySelector('#completed').textContent=completed;document.querySelector('#empty').hidden=tasks.length>0;document.querySelector('#progress-label').textContent=tasks.length?completed===tasks.length?'全部完成，给自己一个小小的鼓励！':`已完成 ${completed} / ${tasks.length} 项，按自己的节奏来`:'准备好，开始今天的第一步';document.querySelector('#progress-bar').style.width=(tasks.length?completed/tasks.length*100:0)+'%'}
const editDialog=document.querySelector('#edit-dialog'),editText=document.querySelector('#edit-text'),editPriority=document.querySelector('#edit-priority');
let editingTask=null,editTrigger=null;
function openEditor(task,trigger){editingTask=task;editTrigger=trigger;editText.value=task.text;editText.setCustomValidity('');editPriority.value=task.priority;editDialog.showModal();editText.focus()}
document.querySelector('#edit-cancel').addEventListener('click',()=>editDialog.close());
editDialog.addEventListener('close',()=>{editingTask=null;if(editTrigger?.isConnected)editTrigger.focus();else input.focus()});
editText.addEventListener('input',()=>editText.setCustomValidity(''));
document.querySelector('#edit-form').addEventListener('submit',e=>{e.preventDefault();const text=editText.value.trim();if(!text){editText.setCustomValidity('请输入任务内容');editText.reportValidity();return}if(editingTask){editingTask.text=text;editingTask.priority=editPriority.value;save();render()}editDialog.close()});
document.querySelector('#clear-all').addEventListener('click',()=>{if(!tasks.length||!window.confirm('确定要清空全部 '+tasks.length+' 个任务吗？此操作无法撤销。'))return;tasks=[];save();render();input.focus()});
document.querySelector('#clear-completed').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render();input.focus()});
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){input.setCustomValidity('请输入任务内容');input.reportValidity();return}tasks.push({id:typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random(),text,done:false,priority:document.querySelector('#new-priority').value});save();render();input.value='';input.focus()});input.addEventListener('input',()=>input.setCustomValidity(''));render();
</script></body></html>
